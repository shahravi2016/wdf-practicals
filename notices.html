<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Notices</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/utils.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">StudentHub</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="notices.html" aria-current="page">Notices</a></li>
                <li><a href="faq.html">FAQ</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h1>Notices</h1>
        </section>

        <section class="notice-controls">
            <div class="controls-row">
                <div class="search-box">
                    <label for="notice-search" class="visually-hidden">Search notices</label>
                    <input type="search" id="notice-search" placeholder="Search notices...">
                </div>
                <div class="filter-box">
                    <label for="notice-filter" class="visually-hidden">Filter by category</label>
                    <select id="notice-filter" aria-label="Filter notices by category">
                        <option value="all">All Categories</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="notice-list-section">
            <div id="notice-container" class="notice-list card-rows" data-renderer='{
                "dataUrl": "data/notices.json",
                "containerSelector": "#notice-container",
                "searchSelector": "#notice-search",
                "filterSelector": "#notice-filter",
                "paginationSelector": "#notice-pagination",
                "itemsPerPage": 10,
                "filterKey": "category",
                "searchKeys": ["title", "description"],
                "templateFn": "noticeTemplate"
            }'></div>
            <div id="notice-pagination"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 StudentHub | <a href="contact.html">Contact</a> | <a href="#">Privacy Policy</a></p>
    </footer>
    <script src="js/script.js"></script>
    <script src="js/data-renderer.js"></script>
    <script>
        function noticeTemplate(notice) {
            return `
                <article class="notice-item">
                    <h3>${notice.title}</h3>
                    <p>${notice.description}</p>
                    <time datetime="${notice.date}">${notice.date}</time>
                </article>
            `;
        }
    </script>
</body>
</html>
