<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Events</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/utils.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">StudentHub</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="events.html" aria-current="page">Events</a></li>
                <li><a href="notices.html">Notices</a></li>
                <li><a href="faq.html">FAQ</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h1>Events</h1>
        </section>

        <section class="events-controls">
            <div class="controls-row">
                <div class="search-box">
                    <label for="search-input" class="visually-hidden">Search events</label>
                    <input type="search" id="search-input" placeholder="Search events..." aria-describedby="search-hint">
                    <span id="search-hint" class="visually-hidden">Type to filter events by title, description, or venue</span>
                </div>
                <div class="filter-box">
                    <label for="filter-select" class="visually-hidden">Filter by category</label>
                    <select id="filter-select" aria-label="Filter events by category">
                        <option value="all">All Categories</option>
                    </select>
                </div>
                <div class="sort-box">
                    <label for="sort-select" class="visually-hidden">Sort events</label>
                    <select id="sort-select" aria-label="Sort events">
                        <option value="date-asc">Date: Oldest First</option>
                        <option value="date-desc" selected>Date: Newest First</option>
                        <option value="name-asc">Title: A-Z</option>
                        <option value="name-desc">Title: Z-A</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="events-list">
            <div id="events-container" class="card-grid" data-renderer='{
                "dataUrl": "data/events.json",
                "containerSelector": "#events-container",
                "searchSelector": "#search-input",
                "filterSelector": "#filter-select",
                "sortSelector": "#sort-select",
                "paginationSelector": "#events-pagination",
                "itemsPerPage": 6,
                "filterKey": "category",
                "searchKeys": ["title", "description", "venue"],
                "templateFn": "eventTemplate"
            }'></div>
            <div id="events-pagination"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 StudentHub | <a href="contact.html">Contact</a> | <a href="#">Privacy Policy</a></p>
    </footer>
    <script src="js/script.js"></script>
    <script src="js/data-renderer.js"></script>
    <script>
        function eventTemplate(event) {
            const startDate = new Date(event.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const endDate = event.endDate && event.endDate !== event.date
                ? ' - ' + new Date(event.endDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
                : '';
            return `
                <article class="card">
                    <h3>${event.title}</h3>
                    <p><strong>Date:</strong> ${startDate}${endDate}</p>
                    <p><strong>Venue:</strong> ${event.venue}</p>
                    <p><strong>Category:</strong> <span class="badge">${event.category}</span></p>
                    <p>${event.description}</p>
                    <a href="#" class="btn">View Details</a>
                </article>
            `;
        }
    </script>
</body>
</html>
