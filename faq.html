<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - FAQ</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/utils.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">StudentHub</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="notices.html">Notices</a></li>
                <li><a href="faq.html" aria-current="page">FAQ</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h1>Frequently Asked Questions</h1>
        </section>

        <section class="faq-controls">
            <div class="controls-row">
                <div class="search-box">
                    <label for="faq-search" class="visually-hidden">Search FAQs</label>
                    <input type="search" id="faq-search" placeholder="Search FAQs..." aria-describedby="faq-search-hint">
                    <span id="faq-search-hint" class="visually-hidden">Type to filter questions and answers</span>
                </div>
                <div class="filter-box">
                    <label for="faq-filter" class="visually-hidden">Filter by category</label>
                    <select id="faq-filter" aria-label="Filter FAQs by category">
                        <option value="all">All Categories</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="faq-list-section">
            <div id="faq-container" class="faq-list" data-renderer='{
                "dataUrl": "data/faqs.json",
                "containerSelector": "#faq-container",
                "searchSelector": "#faq-search",
                "filterSelector": "#faq-filter",
                "paginationSelector": "#faq-pagination",
                "itemsPerPage": 10,
                "filterKey": "category",
                "searchKeys": ["question", "answer"],
                "templateFn": "faqTemplate"
            }'></div>
            <div id="faq-pagination"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 StudentHub | <a href="contact.html">Contact</a> | <a href="#">Privacy Policy</a></p>
    </footer>
    <script src="js/script.js"></script>
    <script src="js/data-renderer.js"></script>
    <script>
        function faqTemplate(faq) {
            return `
                <article class="faq-item">
                    <h3>${faq.question}</h3>
                    <p>${faq.answer}</p>
                    <span class="badge">${faq.category}</span>
                </article>
            `;
        }
    </script>
</body>
</html>
